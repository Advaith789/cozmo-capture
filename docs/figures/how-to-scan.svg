<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">
  <style>
    .ink{fill:#1b2226}
    .mut{fill:#6e7c84}
    .acc{fill:#d14a16}
    .wall{fill:none;stroke:#1b2226;stroke-width:5;stroke-linejoin:round}
    .band{fill:#d14a16;opacity:.07}
    .bandline{fill:none;stroke:#d14a16;stroke-width:1.2;stroke-dasharray:5 4;opacity:.7}
    .path{fill:none;stroke:#d14a16;stroke-width:2.6}
    .dwell{fill:#fff;stroke:#d14a16;stroke-width:2.4}
    .lead{stroke:#6e7c84;stroke-width:1;stroke-dasharray:3 3}
    .h{font-size:15px;font-weight:700}
    .l{font-size:12px}
    .s{font-size:11px}
    .n{font-size:11px;font-weight:700;fill:#d14a16}
    .cap{font-size:12.5px}
    .bad{fill:none;stroke:#a32222;stroke-width:2.2}
  </style>
  <rect width="900" height="470" fill="#ffffff"/>

  <!-- ─────────── panel 1: plan view ─────────── -->
  <text class="ink h" x="34" y="34">1 · Walk the perimeter</text>
  <text class="mut cap" x="34" y="54">Keep the wall on your right the whole way round.</text>

  <!-- room -->
  <rect class="wall" x="60" y="76" width="300" height="270"/>
  <!-- standoff band -->
  <path class="band" d="M60 76 h300 v270 h-300 z M115 131 h190 v160 h-190 z" fill-rule="evenodd"/>
  <rect class="bandline" x="115" y="131" width="190" height="160"/>

  <!-- doorway gap on the bottom wall -->
  <line x1="185" y1="346" x2="245" y2="346" stroke="#ffffff" stroke-width="9"/>
  <text class="mut s" x="215" y="364" text-anchor="middle">doorway</text>

  <!-- walk path -->
  <path class="path" d="M150 300 L150 168 L272 168 L272 300 L172 300"/>
  <polygon class="acc" points="150,155 145,171 155,171"/>
  <polygon class="acc" points="285,168 269,163 269,173"/>
  <polygon class="acc" points="272,313 267,297 277,297"/>
  <polygon class="acc" points="159,300 175,295 175,305"/>

  <!-- dwell markers -->
  <circle class="dwell" cx="150" cy="168" r="11"/><text class="n" x="150" y="172" text-anchor="middle">2s</text>
  <circle class="dwell" cx="272" cy="168" r="11"/><text class="n" x="272" y="172" text-anchor="middle">2s</text>
  <circle class="dwell" cx="272" cy="300" r="11"/><text class="n" x="272" y="304" text-anchor="middle">2s</text>
  <circle class="dwell" cx="150" cy="300" r="11"/><text class="n" x="150" y="304" text-anchor="middle">2s</text>

  <!-- start marker -->
  <circle cx="150" cy="300" r="19" fill="none" stroke="#d14a16" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text class="acc s" x="150" y="336" text-anchor="middle" font-weight="700">start &amp; finish here</text>

  <!-- standoff dimension -->
  <line class="lead" x1="60" y1="110" x2="115" y2="110"/>
  <text class="ink s" x="87" y="104" text-anchor="middle">1–3 m</text>

  <text class="mut s" x="60" y="392">Pause 2 s at every corner. Finish by walking back over</text>
  <text class="mut s" x="60" y="408">your starting point — that is what cancels drift.</text>

  <!-- ─────────── panel 2: what to do at each corner ─────────── -->
  <text class="ink h" x="420" y="34">2 · At each corner, tilt</text>
  <text class="mut cap" x="420" y="54">Down to where wall meets floor, up to where it meets ceiling.</text>

  <!-- section: floor, ceiling, wall -->
  <line x1="470" y1="130" x2="700" y2="130" stroke="#1b2226" stroke-width="4"/>
  <line x1="470" y1="320" x2="700" y2="320" stroke="#1b2226" stroke-width="4"/>
  <line x1="700" y1="130" x2="700" y2="320" stroke="#1b2226" stroke-width="4"/>
  <text class="mut s" x="476" y="122">ceiling line</text>
  <text class="mut s" x="476" y="338">floor line</text>

  <!-- person holding phone -->
  <circle cx="520" cy="238" r="9" class="ink"/>
  <rect x="514" y="250" width="12" height="34" rx="3" class="ink"/>
  <rect x="530" y="243" width="9" height="16" rx="2" fill="#d14a16"/>
  <text class="mut s" x="520" y="300" text-anchor="middle">chest height</text>
  <text class="mut s" x="520" y="314" text-anchor="middle">both hands</text>

  <!-- tilt arcs -->
  <path class="path" d="M548 251 Q620 200 686 140" stroke-dasharray="0"/>
  <polygon class="acc" points="694,133 678,138 686,147"/>
  <path class="path" d="M548 251 Q620 292 686 312"/>
  <polygon class="acc" points="694,316 678,306 682,317"/>
  <path d="M566 232 A 34 34 0 0 1 566 274" fill="none" stroke="#d14a16" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text class="acc s" x="600" y="192">up to the ceiling line</text>
  <text class="acc s" x="600" y="290">down to the floor line</text>

  <text class="mut s" x="420" y="368">Corners and those two junction lines are what the room's</text>
  <text class="mut s" x="420" y="384">dimensions are computed from. Turn with your feet, not your wrist.</text>

  <!-- ─────────── do not ─────────── -->
  <text class="ink h" x="420" y="424">Do not stand in the middle and spin</text>
  <circle cx="440" cy="447" r="14" class="bad"/>
  <path class="bad" d="M431 441 A 12 12 0 1 1 440 461"/>
  <polygon fill="#a32222" points="437,436 449,441 438,447"/>
  <text class="mut cap" x="466" y="452">Measured 6× more drift, and it fails the repeatability gate.</text>
</svg>
